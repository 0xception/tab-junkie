<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../shared/styles.css" />
  <link rel="stylesheet" href="../shared/themes.css" />
  <link rel="stylesheet" href="group-jump.css" />
  <link rel="stylesheet" href="../shared/theme-ready.css" />
  <script src="../shared/theme-init.js"></script>
  <title>Jump to Group</title>
</head>
<body>
  <!-- Group List View -->
  <div id="group-list-view">
    <search-bar placeholder="Jump to group..."></search-bar>
    <main id="group-results"></main>
    <footer class="keyboard-hints">
      <span><kbd>&#x2191;&#x2193;</kbd> navigate</span>
      <span><kbd>&#x23CE;</kbd> drill in</span>
      <span><kbd>tab</kbd> scroll panel</span>
      <span><kbd>esc</kbd> close</span>
    </footer>
  </div>

  <!-- Drill-In View (hidden by default) -->
  <div id="drill-view" class="hidden">
    <div class="drill-header">
      <button class="back-btn" id="back-btn">&#x2190; Back</button>
      <span class="drill-dot" id="drill-dot"></span>
      <span class="drill-group-name" id="drill-group-name"></span>
      <span class="drill-counts" id="drill-counts"></span>
    </div>
    <search-bar placeholder="Filter bookmarks..."></search-bar>
    <main id="drill-results"></main>
    <footer class="keyboard-hints">
      <span><kbd>&#x232B;</kbd> back</span>
      <span><kbd>&#x2191;&#x2193;</kbd> navigate</span>
      <span><kbd>&#x23CE;</kbd> open</span>
      <span><kbd>tab</kbd> scroll panel</span>
      <span><kbd>esc</kbd> close</span>
    </footer>
  </div>

  <script type="module" src="../components/search-bar.js"></script>
  <script type="module" src="group-jump.js"></script>
</body>
</html>
