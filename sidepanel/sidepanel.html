<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab Junkie</title>
    <!-- B-037 §45.3 D-4: shared FOUC guard runs SYNC before any stylesheet so
         the cached `data-theme` attribute is set before paint. Shared themes
         stylesheet loads BEFORE the surface-specific stylesheet so palette
         tokens resolve before component rules consume them. -->
    <script src="../shared/theme-init.js"></script>
    <link rel="stylesheet" href="../shared/themes.css" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div id="panel-header" class="panel-header" hidden>
      <span class="panel-header-title">Tab Junkie</span>
      <div id="filter-container">
        <input
          type="search"
          id="filter-input"
          placeholder="Filter..."
          aria-label="Filter bookmarks"
          autocomplete="off"
          spellcheck="false"
          maxlength="256"
        />
        <button id="filter-clear-btn" aria-label="Clear filter" hidden>×</button>
      </div>
      <button id="add-bookmark-btn" class="header-add-btn" aria-label="Add bookmark" type="button">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <!-- B-081: new group (opens group dialog in create mode) -->
      <button id="add-group-btn" class="header-add-btn" aria-label="New group" type="button">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2 4a1 1 0 0 1 1-1h3l1.5 1.5H13a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V4z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M8 7v4M6 9h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <!-- B-093: B-042/043/044/045 import + export buttons relocated to the
           Settings page Data section. Header now retains New Group + gear only. -->
      <!-- B-091: settings entry affordance. Rightmost in the header toolbar
           (gear icon). Opens the full-page Settings tab via
           chrome.tabs.create / chrome.tabs.update — the dispatcher is wired
           below in sidepanel.js (focus-existing-else-create per §44.3 D-2). -->
      <button id="sidepanel-settings-btn" class="header-add-btn" aria-label="Open Settings page" type="button">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z" stroke="currentColor" stroke-width="1.4"/>
          <path d="M8 1.5v1.6M8 12.9v1.6M3.4 3.4l1.2 1.2M11.4 11.4l1.2 1.2M1.5 8h1.6M12.9 8h1.6M3.4 12.6l1.2-1.2M11.4 4.6l1.2-1.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </button>
      <!-- B-014: window filter row. Populated at runtime by
           _rebuildWindowFilterRow; hidden until ≥ 2 browser windows are open. -->
      <div id="window-filter-row"
           class="window-filter-row"
           role="tablist"
           aria-label="Filter by window"
           hidden></div>
    </div>

    <!-- Loading skeleton — visible by default -->
    <div id="skeleton" class="skeleton" role="status" aria-label="Loading bookmarks">
      <div class="skeleton-group">
        <div class="skeleton-header shimmer"></div>
        <div class="skeleton-row shimmer"></div>
        <div class="skeleton-row shimmer"></div>
        <div class="skeleton-row shimmer"></div>
      </div>
      <div class="skeleton-group">
        <div class="skeleton-header shimmer"></div>
        <div class="skeleton-row shimmer"></div>
        <div class="skeleton-row shimmer"></div>
      </div>
      <div class="skeleton-group">
        <div class="skeleton-header shimmer"></div>
        <div class="skeleton-row shimmer"></div>
        <div class="skeleton-row shimmer"></div>
        <div class="skeleton-row shimmer"></div>
        <div class="skeleton-row shimmer"></div>
      </div>
    </div>

    <!-- Empty state — hidden by default -->
    <div id="empty-state" class="empty-state" hidden>
      <svg class="empty-state-icon" width="64" height="64" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <rect x="8" y="12" width="48" height="40" rx="4" stroke="currentColor" stroke-width="2" />
        <path d="M8 22h48" stroke="currentColor" stroke-width="2" />
        <circle cx="14" cy="17" r="2" fill="currentColor" />
        <circle cx="20" cy="17" r="2" fill="currentColor" />
        <circle cx="26" cy="17" r="2" fill="currentColor" />
        <path d="M24 36l6 6 10-12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <p class="empty-state-message">No bookmarks yet</p>
      <button class="empty-state-cta">Add your first bookmark</button>
    </div>

    <!-- Error state — hidden by default -->
    <div id="error-state" class="error-state" hidden>
      <svg class="error-state-icon" width="64" height="64" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <path d="M32 8l24 44H8L32 8z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <path d="M32 26v12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="32" cy="44" r="2" fill="currentColor"/>
      </svg>
      <p class="error-state-message">Unable to load bookmarks. The extension may still be starting up. Try reopening the panel.</p>
    </div>

    <!-- Filter empty state — hidden by default -->
    <div id="filter-empty-state" role="status" aria-live="polite" aria-atomic="true" hidden>
      <svg class="filter-empty-state-icon" width="48" height="48" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <circle cx="20" cy="20" r="14" stroke="currentColor" stroke-width="2" />
        <path d="M30 30l10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        <path d="M15 20h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
      <p class="filter-empty-state-message">No items match your filter.</p>
      <button id="filter-empty-clear-btn" class="empty-state-cta" type="button">Clear filter</button>
    </div>

    <!-- Item list container — hidden by default -->
    <div id="item-list" role="list" aria-label="Bookmarks" hidden></div>

    <!-- Bulk action bar (B-024) — hidden until selection active -->
    <div id="bulk-action-bar" role="toolbar" aria-label="Bulk actions" hidden>
      <span id="bulk-count"></span>
      <button id="bulk-move" type="button">Move to group</button>
      <button id="bulk-close" type="button">Close tabs</button>
      <button id="bulk-remove" type="button" class="btn-destructive">Remove</button>
      <button id="bulk-clear" type="button">Clear</button>
    </div>

    <div id="dialog-overlay" class="dialog-overlay" hidden aria-hidden="true">
      <div id="bookmark-dialog" class="dialog-modal" role="dialog"
           aria-modal="true" aria-labelledby="dialog-heading">
        <h2 id="dialog-heading" class="dialog-title">Add Bookmark</h2>
        <form id="bookmark-form" class="dialog-form" novalidate>
          <div class="dialog-field">
            <label for="field-title" class="dialog-label">Title</label>
            <input id="field-title" name="title" type="text" class="dialog-input"
                   autocomplete="off" maxlength="512" required />
            <span id="error-title" class="dialog-field-error" aria-live="polite" hidden></span>
          </div>
          <div class="dialog-field">
            <label for="field-url" class="dialog-label">URL</label>
            <input id="field-url" name="url" type="text" class="dialog-input"
                   autocomplete="off" required />
            <span id="error-url" class="dialog-field-error" aria-live="polite" hidden></span>
          </div>
          <div class="dialog-field">
            <label for="field-group" class="dialog-label">Group</label>
            <select id="field-group" name="groupId" class="dialog-select"></select>
          </div>
          <span id="error-dialog" class="dialog-level-error" aria-live="assertive" hidden></span>
          <div class="dialog-actions">
            <button type="button" id="dialog-cancel-btn" class="dialog-btn dialog-btn--secondary">Cancel</button>
            <button type="submit" id="dialog-submit-btn" class="dialog-btn dialog-btn--primary">Save</button>
          </div>
        </form>
      </div>
      <div id="confirm-dialog" class="dialog-modal" role="alertdialog"
           aria-modal="true" aria-labelledby="confirm-heading" aria-describedby="confirm-body" hidden>
        <h2 id="confirm-heading" class="dialog-title"></h2>
        <p id="confirm-body" class="dialog-body"></p>
        <div class="dialog-actions">
          <button type="button" id="confirm-cancel-btn" class="dialog-btn dialog-btn--secondary">Cancel</button>
          <button type="button" id="confirm-delete-btn" class="dialog-btn dialog-btn--danger">Delete</button>
        </div>
      </div>
      <!-- B-027: Group edit dialog -->
      <div id="group-dialog" class="dialog-modal" role="dialog"
           aria-modal="true" aria-labelledby="group-dialog-heading" hidden>
        <h2 id="group-dialog-heading" class="dialog-title">Edit Group</h2>
        <form id="group-form" class="dialog-form" novalidate>
          <div class="dialog-field">
            <label for="group-field-name" class="dialog-label">Name</label>
            <input id="group-field-name" name="name" type="text" class="dialog-input"
                   autocomplete="off" maxlength="256" required />
            <span id="group-error-name" class="dialog-field-error" aria-live="polite" hidden></span>
          </div>
          <div class="dialog-field">
            <label class="dialog-label">Color</label>
            <div id="group-color-swatches" class="group-color-swatches" role="radiogroup" aria-label="Group color"></div>
            <span id="group-error-color" class="dialog-field-error" aria-live="polite" hidden></span>
          </div>
          <!-- B-007: Parent group picker -->
          <div class="dialog-field">
            <label for="group-field-parent" class="dialog-label">Parent group</label>
            <select id="group-field-parent" name="parentId" class="dialog-input">
              <option value="">Top-level (no parent)</option>
            </select>
            <span id="group-error-parent" class="dialog-field-error" aria-live="polite" hidden></span>
          </div>
          <span id="group-error-dialog" class="dialog-level-error" aria-live="assertive" hidden></span>
          <div class="dialog-actions">
            <button type="button" id="group-cancel-btn" class="dialog-btn dialog-btn--secondary">Cancel</button>
            <button type="submit" id="group-submit-btn" class="dialog-btn dialog-btn--primary">Save</button>
          </div>
        </form>
      </div>
      <!-- B-091: B-089 settings dialog removed. The Settings surface is now a
           full-page tab at chrome-extension://<id>/settings/settings.html;
           gear-button click dispatches via chrome.tabs.create/update below. -->
      <!-- B-029: Group picker modal (move/save to group) -->
      <div id="group-picker-dialog" class="dialog-modal group-picker-dialog" role="dialog"
           aria-modal="true" aria-labelledby="group-picker-heading" hidden>
        <h2 id="group-picker-heading" class="dialog-title group-picker-heading">Move to group</h2>
        <input id="group-picker-filter" class="dialog-input group-picker-filter"
               type="search" placeholder="Filter groups..."
               aria-label="Filter groups" autocomplete="off" spellcheck="false" />
        <div id="group-picker-list" class="group-picker-list"
             role="listbox" aria-label="Groups" tabindex="-1"></div>
        <div id="group-picker-empty" class="group-picker-empty" hidden>
          <p class="group-picker-empty-message">No groups yet &mdash; create a group first.</p>
          <button type="button" id="group-picker-create-btn" class="dialog-btn dialog-btn--primary">Create group</button>
        </div>
      </div>
    </div>

    <!-- Toast for transient errors — hidden by default. B-099 adds an
         optional Undo affordance (hidden until showToast({undoLabel,onUndo})
         is invoked). -->
    <div id="toast" class="toast" role="alert" aria-live="assertive" hidden>
      <span id="toast-message" class="toast-message"></span>
      <button id="toast-undo" class="toast-undo" type="button" hidden>Undo</button>
      <button id="toast-dismiss" class="toast-dismiss" aria-label="Dismiss" type="button">&times;</button>
    </div>

    <div id="context-menu" class="context-menu" role="menu" hidden></div>

    <script src="sidepanel.js" type="module" defer></script>
  </body>
</html>
