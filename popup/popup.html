<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <title>Tab Junkie — Quick Search</title>
    <!-- B-037 §45.3 D-4: shared FOUC guard runs SYNC before any stylesheet so
         the cached `data-theme` attribute is set before paint. Shared themes
         stylesheet loads BEFORE the surface-specific stylesheet so palette
         tokens resolve before component rules consume them. -->
    <script src="../shared/theme-init.js"></script>
    <link rel="stylesheet" href="../shared/themes.css" />
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <div id="qs-root" role="dialog" aria-label="Quick Search" aria-modal="true" tabindex="-1">
      <div id="qs-input-wrap" role="combobox" aria-expanded="false" aria-controls="qs-list" aria-haspopup="listbox">
        <input
          id="qs-input"
          type="search"
          autocomplete="off"
          spellcheck="false"
          maxlength="256"
          placeholder="Search bookmarks and tabs…"
          aria-autocomplete="list"
          aria-controls="qs-list"
          aria-activedescendant=""
        />
      </div>
      <div id="qs-status" role="status" aria-live="polite" aria-atomic="true" class="qs-visually-hidden"></div>
      <div id="qs-results-scroll">
        <ul id="qs-list" role="listbox" aria-label="Results"></ul>
        <div id="qs-skeleton" class="qs-skeleton" hidden aria-hidden="true"></div>
      </div>
      <div id="qs-empty" hidden aria-hidden="true"></div>
      <div id="qs-footer">
        <button id="popup-open-sidepanel-btn" type="button" aria-label="Open side panel">Open side panel</button>
        <button id="popup-open-settings-btn" type="button" aria-label="Open Settings">Open Settings</button>
        <div id="qs-sidepanel-error" class="qs-visually-hidden" role="alert" aria-live="assertive" aria-atomic="true"></div>
      </div>
    </div>
  </body>
</html>
